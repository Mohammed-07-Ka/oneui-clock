name: Build OneUI Clock APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        id: apk-path
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneUI-Clock-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'One UI Clock (Latest Build)' }}
          body: |
            ### One UI Clock for Android (Samsung Clock Replica)
            - **Direct Download**: Download the `.apk` file below directly to your Android device without unzipping.
            - **Commit**: `${{ github.sha }}`
            - **Build Trigger**: `${{ github.event_name }}` on `${{ github.ref_name }}`
            
            #### Sections & Features:
            - **Alarm**: Room DB persistence, exact `AlarmManager` scheduling, Foreground Service, Ringing Screen, and In-App Banner with Dismiss & Snooze.
            - **Stopwatch**: Precision `SystemClock.elapsedRealtime()` timing with laps and centisecond resolution (`00..99`).
            - **Timer**: Countdown with presets, "+1 min" button, visual circular progress, and audio alert tone upon completion.
            - **World Clock**: Real timezone calculations with interactive Time Zone Converter slider and city search.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
